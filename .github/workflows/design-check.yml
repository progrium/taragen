name: Design check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Design check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch every branch tip
        run: git fetch --no-tags --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/design check
