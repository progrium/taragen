name: Design status
on:
  push:
    branches: [main]
    paths:
      - 'docs/design/**'
      - 'tools/design/**'
      - 'internal/design/**'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: design-status
  cancel-in-progress: true
jobs:
  status:
    name: Regenerate status index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch every branch tip
        run: git fetch --no-tags --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./tools/design status
      - run: go run ./tools/design close-issues
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit the index if it changed
        run: |
          git add docs/design/STATUS.md
          if git diff --cached --quiet; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'design: regenerate status index'
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
