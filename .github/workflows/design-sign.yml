name: Design sign
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: design-sign-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  sign:
    name: Sign by comment
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/sign ') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
      COMMENTER: ${{ github.event.comment.user.login }}
      COMMENTED_AT: ${{ github.event.comment.created_at }}
      BODY: ${{ github.event.comment.body }}
    steps:
      - name: Read the request
        id: req
        run: |
          first=$(printf '%s\n' "$BODY" | head -n1 | tr -d '\r')
          target=$(printf '%s' "$first" | sed -nE 's/^\/sign ([a-z0-9]+(-[a-z0-9]+)*)[[:space:]]*$/\1/p')
          if [ -z "$target" ]; then
            echo "error=expected \`/sign <slug>\` or \`/sign spec\` on the first line" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          if [ "$(jq -r .head.repo.full_name <<<"$pr")" != "$GITHUB_REPOSITORY" ]; then
            echo "error=this PR comes from a fork; signing works only on branches in this repository" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$(jq -r .head.ref <<<"$pr")" >> "$GITHUB_OUTPUT"
      # Build the tool and read the signers list from main, never from the PR,
      # so a PR can't change who may sign or how signing works.
      - uses: actions/checkout@v4
        if: steps.req.outputs.error == ''
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: steps.req.outputs.error == ''
        with:
          go-version-file: go.mod
      - name: Sign
        id: sign
        if: steps.req.outputs.error == ''
        env:
          TARGET: ${{ steps.req.outputs.target }}
          BRANCH: ${{ steps.req.outputs.branch }}
        run: |
          go build -o "$RUNNER_TEMP/design" ./tools/design
          cp docs/design/SIGNERS "$RUNNER_TEMP/SIGNERS.main"
          if ! grep -v '^#' "$RUNNER_TEMP/SIGNERS.main" | awk '{print tolower($1)}' | grep -qx "$(printf '%s' "$COMMENTER" | tr 'A-Z' 'a-z')"; then
            echo "error=@$COMMENTER is not in docs/design/SIGNERS on main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          had_signers=false
          if [ -f docs/design/SIGNERS ]; then had_signers=true; cp docs/design/SIGNERS "$RUNNER_TEMP/SIGNERS.pr"; fi
          mkdir -p docs/design
          cp "$RUNNER_TEMP/SIGNERS.main" docs/design/SIGNERS

          date=$(date -u -d "$COMMENTED_AT" +%Y-%m-%d)
          set +e
          out=$("$RUNNER_TEMP/design" -C "$PWD" sign "$TARGET" --login "$COMMENTER" --date "$date" </dev/null 2>&1)
          rc=$?
          set -e

          # put the PR's own signers list back; only the signed file is committed
          if $had_signers; then cp "$RUNNER_TEMP/SIGNERS.pr" docs/design/SIGNERS; else rm -f docs/design/SIGNERS; fi
          if [ $rc -ne 0 ]; then
            { echo "error<<SIGN_EOF"; echo "$out"; echo "SIGN_EOF"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TARGET" = spec ]; then file=docs/spec.md; else file="docs/design/$TARGET.md"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "design: sign $TARGET for $COMMENTER" -- "$file"
          git push origin "HEAD:$BRANCH"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reply
        if: always()
        env:
          ERR: ${{ steps.req.outputs.error || steps.sign.outputs.error }}
          COMMIT: ${{ steps.sign.outputs.commit }}
          TARGET: ${{ steps.req.outputs.target }}
        run: |
          if [ -n "$COMMIT" ]; then
            msg="Signed \`$TARGET\` for @$COMMENTER in $COMMIT."
          elif [ -n "$ERR" ]; then
            msg=$(printf 'Did not sign:\n\n```\n%s\n```' "$ERR")
          else
            msg="Did not sign: the signing job failed; see the workflow run."
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$msg" >/dev/null
