[package]
name = "taragen-resvg"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
resvg = { version = "=0.50.0", default-features = false, features = ["text", "raster-images"] }
wuff = "=0.2.10"

[profile.release]
# Optimized for speed, not size: at "s" rasterizing a 1200x630 card took about
# three times as long, for a module only about 0.5 MB smaller.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
